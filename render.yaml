services:
  - type: web
    name: familybudget
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: familybudget-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: AI_ENABLED
        value: "false"
      - key: NODE_ENV
        value: production

  - type: cron
    name: familybudget-insights
    runtime: docker
    plan: starter
    schedule: "15 */4 * * *"
    dockerCommand: sh -c "npx prisma migrate deploy && npm run insights:recompute"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: familybudget-db
          property: connectionString

  - type: cron
    name: familybudget-notifications
    runtime: docker
    plan: starter
    schedule: "*/15 * * * *"
    dockerCommand: sh -c "npx prisma migrate deploy && npm run notifications:run"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: familybudget-db
          property: connectionString

databases:
  - name: familybudget-db
    databaseName: familybudget
    user: familybudget
    plan: basic-256mb
